name: Refresh Computational Sensors index once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/refresh-computational-sensors-index.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch showcase listing
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('manifest.json')
          index_path = Path('index.html')
          slug = 'ai/agent-work-harness/computational-sensors-typescript'
          entry = {
              'title': 'TypeScript Computational Sensors：AI 程式碼的機械檢測 Harness',
              'rel': 'notes/ai/agent-work-harness/computational-sensors-typescript.md',
              'slug': slug,
              'url': f'note.html?slug={slug}',
              'excerpt': '這篇整理 Martin Fowler 網站上 Harness Engineering 系列的 Computational Sensors 概念，並落到 TypeScript 專案：哪些問題應該交給型別檢查、Lint、架構規則、測試、Mutation Testing、安全掃描等工具機械判定，以及這些結果怎麼成為 Agent 可重跑、可比較的 evidence。 參考文章：…',
          }

          entries = json.loads(manifest_path.read_text(encoding='utf-8'))
          old_count = len(entries)
          if not any(e.get('slug') == slug for e in entries):
              entries.insert(0, entry)
          new_count = len(entries)
          manifest_path.write_text(json.dumps(entries, ensure_ascii=False, indent=2), encoding='utf-8')

          html = index_path.read_text(encoding='utf-8')
          marker = f'href="note.html?slug={slug}"'
          if marker not in html:
              card = (
                  f'<a class="card" data-search="" href="note.html?slug={slug}"><div>'
                  f'<h3 class="card-title">{entry["title"]}</h3>'
                  f'<p class="card-excerpt">{entry["excerpt"]}</p></div>'
                  f'<div class="card-meta"><code>{entry["rel"]}</code></div></a>\n'
              )
              anchor = '<div id="cards" class="grid">'
              if anchor not in html:
                  raise SystemExit('cards grid anchor not found')
              html = html.replace(anchor, anchor + card, 1)
          html = html.replace(f'目前共 {old_count} 篇筆記。', f'目前共 {new_count} 篇筆記。', 1)
          html = html.replace(f'<p id="resultCount" class="count">共 {old_count} 篇</p>', f'<p id="resultCount" class="count">共 {new_count} 篇</p>', 1)
          index_path.write_text(html, encoding='utf-8')
          print(f'listing: {old_count} -> {new_count}')
          PY

      - name: Commit showcase listing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json index.html
          if git diff --cached --quiet; then
            echo 'No showcase listing changes'
            exit 0
          fi
          git commit -m 'docs: add TypeScript computational sensors to showcase listing'
          git push
