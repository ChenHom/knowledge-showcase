<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Mirror</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--card:#fff;--line:#e2e8f0;--accent:#0284c7;--accent-light:#f0f9ff;--shadow:0 1px 3px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f19;--text:#f1f5f9;--muted:#94a3b8;--card:#151d2a;--line:#243144;--accent:#38bdf8;--accent-light:#0c2a40;--shadow:0 1px 3px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}main{max-width:1200px;margin:auto;padding:16px 14px 80px}.hero{padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}.hero h1{font-size:1.4rem;margin:0 0 4px}.hero p,.count,.status{color:var(--muted);font-size:.88rem}.search{width:100%;margin-top:10px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:flex;flex-direction:column;justify-content:space-between;padding:15px 17px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;text-decoration:none;box-shadow:var(--shadow)}.card:hover{border-color:var(--accent);transform:translateY(-2px)}.card-title{font-size:1.02rem;line-height:1.4;margin:0 0 6px}.card-excerpt{font-size:.86rem;color:var(--muted);margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-meta{font-size:.74rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}.pagination{display:flex;justify-content:center;gap:6px;margin-top:28px;flex-wrap:wrap}.page-btn{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.page-btn:disabled{opacity:.4;cursor:not-allowed}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--card);grid-column:1/-1}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header class="hero"><h1>Knowledge Mirror</h1><p id="summary">載入知識庫中…</p><input id="search" class="search" type="search" placeholder="輸入關鍵字搜尋（如 RESTful、Refund、RAG、Agent）" autocomplete="off"></header>
<p id="count" class="count"></p>
<div id="cards" class="grid"></div>
<nav id="pagination" class="pagination"></nav>
</main>
<script>
(()=>{
const PAGE_SIZE=9;
const latest={title:'RESTful 退款 API 設計：從 Resource Modeling 到 Idempotency、Concurrency 與 Reconciliation',rel:'notes/backend/api/restful-refund-api-design.md',slug:'restful-refund-api-design',url:'note.html?slug=restful-refund-api-design',excerpt:'以退款 API 為例，整理 Resource Modeling、Idempotency、部分與多次退款、Redis Lock vs DB Lock、Conditional Update、非同步退款、Callback 與 Reconciliation。'};
let entries=[],page=1;
const cards=document.getElementById('cards'),count=document.getElementById('count'),summary=document.getElementById('summary'),search=document.getElementById('search'),pagination=document.getElementById('pagination');
const norm=s=>(s||'').toLocaleLowerCase('zh-Hant');
function filtered(){const q=norm(search.value.trim());return entries.filter(e=>!q||norm(`${e.title} ${e.excerpt||''} ${e.rel||''}`).includes(q));}
function render(){const list=filtered();const pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));if(page>pages)page=1;const start=(page-1)*PAGE_SIZE;const shown=list.slice(start,start+PAGE_SIZE);cards.innerHTML=shown.length?shown.map(e=>`<a class="card" href="${e.url}"><div><h3 class="card-title">${esc(e.title)}</h3><p class="card-excerpt">${esc(e.excerpt||'')}</p></div><div class="card-meta"><code>${esc(e.rel||'')}</code></div></a>`).join(''):'<div class="empty">找不到符合的筆記。</div>';count.textContent=search.value.trim()?`找到 ${list.length} 篇（第 ${page} / ${pages} 頁）`:`共 ${entries.length} 篇（第 ${page} / ${pages} 頁）`;pagination.innerHTML='';if(pages>1){pagination.append(btn('‹ 上一頁',page===1,()=>{page--;render()}));for(let i=1;i<=pages;i++){const b=btn(String(i),false,()=>{page=i;render()});if(i===page)b.classList.add('active');pagination.append(b)}pagination.append(btn('下一頁 ›',page===pages,()=>{page++;render()}));}}
function btn(text,disabled,fn){const b=document.createElement('button');b.className='page-btn';b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
search.addEventListener('input',()=>{page=1;render()});
fetch('manifest.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{entries=Array.isArray(data)?data:[];if(!entries.some(e=>e.slug===latest.slug))entries.unshift(latest);summary.textContent=`知識展示與分享庫。目前共 ${entries.length} 篇筆記。`;render()}).catch(err=>{entries=[latest];summary.textContent='manifest 載入失敗，顯示最新筆記。';count.textContent=`載入錯誤：${err.message}`;render()});
})();
</script>
</body></html>
