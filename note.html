<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Knowledge Mirror</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230284c7%27/%3E%3Cpath d=%27M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 0-3 3z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M9 24a3 3 0 0 1 3-3h11%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><style>
:root {
  color-scheme: light dark;
  --bg: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --card: #ffffff;
  --card-hover: #ffffff;
  --line: #e2e8f0;
  --accent: #0284c7;
  --accent-light: #f0f9ff;
  --code: #0f172a;
  --codeText: #f8fafc;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-hover: 0 6px 16px rgba(2, 132, 199, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f19;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --card: #151d2a;
    --card-hover: #1a2436;
    --line: #243144;
    --accent: #38bdf8;
    --accent-light: #0c2a40;
    --code: #070a12;
    --codeText: #f1f5f9;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 6px 20px rgba(56, 189, 248, 0.12);
  }
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 14px 80px;
}

/* Nav & Top Header */
.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 5px 12px;
  border-radius: 6px;
  background: var(--accent-light);
  transition: all 0.2s ease;
}
.back-link:hover {
  filter: brightness(0.95);
  transform: translateX(-2px);
}
.nav-meta {
  font-size: 0.8rem;
  color: var(--muted);
}

.hero-compact {
  margin-bottom: 16px;
  padding: 18px 20px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero-compact h1 {
  font-size: 1.4rem;
  font-weight: 700;
  margin: 0 0 4px 0;
}
.hero-compact p {
  margin: 0;
  color: var(--muted);
  font-size: 0.88rem;
}

/* Grid & Cards (3-column layout) */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 950px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
}

.card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: all 0.18s ease;
}
.card:hover {
  border-color: var(--accent);
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.card-title {
  font-size: 1.02rem;
  font-weight: 700;
  line-height: 1.4;
  margin: 0 0 6px 0;
  color: var(--text);
}
.card:hover .card-title {
  color: var(--accent);
}
.card-excerpt {
  font-size: 0.86rem;
  color: var(--muted);
  line-height: 1.48;
  margin: 0 0 12px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  font-size: 0.74rem;
  color: var(--muted);
  margin-top: auto;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
}
.card-meta code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* Search bar */
.search-box {
  margin-top: 10px;
}
.search-box input {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 13px;
  font-size: 0.9rem;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus {
  border-color: var(--accent);
}
.count {
  margin: 12px 0 10px;
  font-size: 0.84rem;
  color: var(--muted);
}
.empty {
  grid-column: 1 / -1;
  padding: 28px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--muted);
  background: var(--card);
}

/* Pagination Bar */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-top: 28px;
}
.page-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.page-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}
.page-btn.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}
.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.article-container { max-width: 900px; margin: 0 auto; }
.markdown-body {
  font-size: 1rem;
  line-height: 1.75;
  word-wrap: break-word;
}
.markdown-body > *:first-child { margin-top: 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin-top: 1.8em;
  margin-bottom: 0.7em;
  font-weight: 700;
  line-height: 1.3;
}
.markdown-body h1 { font-size: 1.9rem; padding-bottom: 0.3em; border-bottom: 1px solid var(--line); }
.markdown-body h2 { font-size: 1.4rem; padding-bottom: 0.3em; border-bottom: 1px solid var(--line); }
.markdown-body h3 { font-size: 1.15rem; }
.markdown-body h4 { font-size: 1rem; }
.markdown-body p { margin: 0 0 1.1em; }
.markdown-body a { color: var(--accent); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body ul, .markdown-body ol { padding-left: 2em; margin: 0 0 1.1em; }
.markdown-body li { margin: 0.3em 0; }
.markdown-body li > p { margin: 0.4em 0; }
.markdown-body blockquote {
  margin: 0 0 1.1em;
  padding: 0.2em 1em;
  color: var(--muted);
  border-left: 0.25em solid var(--line);
}
.markdown-body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.87em;
  padding: 0.2em 0.4em;
  border-radius: 6px;
  background: var(--inline-code-bg);
}
.markdown-body pre {
  overflow-x: auto;
  padding: 16px;
  border-radius: 8px;
  background: var(--pre-bg);
  border: 1px solid var(--line);
  margin: 0 0 1.2em;
  line-height: 1.5;
}
.markdown-body pre code {
  padding: 0;
  background: none;
  font-size: 0.85rem;
  white-space: pre;
}
.markdown-body table {
  display: block;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
  margin: 0 0 1.2em;
  font-size: 0.92rem;
}
.markdown-body th, .markdown-body td {
  padding: 7px 14px;
  border: 1px solid var(--line);
}
.markdown-body th { font-weight: 700; background: var(--table-head); }
.markdown-body tr:nth-child(2n) td { background: var(--table-alt); }
.markdown-body img { max-width: 100%; }
.markdown-body hr { height: 1px; border: 0; background: var(--line); margin: 1.8em 0; }
.markdown-body .mermaid {
  margin: 0 0 1.4em;
  padding: 14px;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow-x: auto;
}
:root {
  --inline-code-bg: rgba(129, 139, 152, 0.16);
  --pre-bg: #f6f8fa;
  --table-head: #f6f8fa;
  --table-alt: #fafbfc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --inline-code-bg: rgba(110, 118, 129, 0.4);
    --pre-bg: #0d1117;
    --table-head: #161b22;
    --table-alt: #10151d;
  }
}
.doc-title { font-size: 0.8rem; color: var(--muted); }
.loading, .load-error {
  padding: 40px;
  text-align: center;
  color: var(--muted);
}
.load-error { color: #dc2626; }
</style></head><body><main><nav class="top-nav"><a class="back-link" href="index.html">← 回首頁</a><span class="nav-meta"><code id="docPath" class="doc-title"></code></span></nav><div class="article-container"><article id="content" class="markdown-body"><p class="loading">載入中…</p></article></div></main><script src="assets/vendor/marked.umd.js"></script>
<script src="assets/vendor/mermaid.min.js"></script>
<script>(()=>{
const params = new URLSearchParams(location.search);
const slug = params.get('slug') || '';
const body = document.getElementById('content');
const meta = document.getElementById('docPath');

// Static site, but keep the slug to a known-safe shape before building a path.
if (!/^[A-Za-z0-9._-]+$/.test(slug)) {
  body.innerHTML = '<p class="load-error">找不到這篇筆記（slug 不合法）。</p>';
  return;
}

const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });

marked.setOptions({ gfm: true, breaks: false });

fetch('notes/' + slug + '.md')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => {
    body.innerHTML = marked.parse(md);

    // First heading is the document title.
    const h1 = body.querySelector('h1');
    if (h1) document.title = h1.textContent.trim();
    meta.textContent = slug + '.md';

    // marked emits ```mermaid as <pre><code class="language-mermaid">.
    // Mermaid needs a plain element holding the raw source instead.
    body.querySelectorAll('pre > code.language-mermaid').forEach(code => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    const diagrams = body.querySelectorAll('.mermaid');
    if (diagrams.length) {
      mermaid.run({ nodes: diagrams }).catch(e => console.error('mermaid', e));
    }
  })
  .catch(err => {
    body.innerHTML = '<p class="load-error">載入失敗：找不到 notes/' + slug + '.md（' + err.message + '）</p>';
  });
})();</script></body></html>
